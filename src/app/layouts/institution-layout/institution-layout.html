
<app-public-header />

<nav class="institution-portal-nav" aria-label="Navegación del portal institucional">
  <div class="institution-portal-nav__inner">
    @for (item of portalLinks; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
      >
        {{ item.label }}
      </a>
    }
  </div>
</nav>

<div class="institution-layout-content">
  <router-outlet />
</div>
