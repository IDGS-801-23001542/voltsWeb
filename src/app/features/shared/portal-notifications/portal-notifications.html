<section class="portal-page"><header><div><span>Tu actividad</span><h1>Notificaciones</h1></div><button type="button" (click)="markAll()">Marcar todas como leídas</button></header>@if(error()){<p class="error">{{error()}}</p>}<div class="notification-list">@for(item of items();track item.id){<button type="button" [class.unread]="!item.isRead" (click)="open(item)"><div><strong>{{item.title}}</strong><p>{{item.message}}</p><small>{{item.createdAt|date:'dd/MM/yyyy HH:mm'}} · {{item.module}}</small></div>@if(item.route){<span>Abrir →</span>}</button>}@empty{<p>No tienes notificaciones.</p>}</div></section>
